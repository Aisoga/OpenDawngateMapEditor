<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map editor</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ground.css">
</head>
<body>
<!-- The frame (frame.js): the menu bar, the toolbar, the minimap with the selection below it, one main view (2-D or
     3-D), the palettes docked on the right as tabs (Terrain, Doodads, Units, Lanes) and the four-part status bar. -->
<nav id="menubar" aria-label="Menu bar"></nav>

<header id="toolbar">
  <button id="btnNew" title="New Map from Template... (Ctrl+N)">New</button>
  <button id="btnOpen" title="Open Map... (Ctrl+O)">Open</button>
  <button id="btnSave" title="Save Map (Ctrl+S)">Save</button>
  <span class="sep"></span>
  <button id="btnUndo" title="Undo (Ctrl+Z)"><i class="ic">&#x21B6;</i>Undo</button>
  <button id="btnRedo" title="Redo (Ctrl+Y)"><i class="ic">&#x21B7;</i>Redo</button>
  <span class="sep"></span>
  <button id="btnSelect" data-tool="select" title="Select (Space switches between selecting and the palette's tool)"><i class="ic">&#x2196;</i>Select</button>
  <span class="sep"></span>
  <button data-tab="terrain" title="Terrain palette (T)"><b>T</b> Terrain</button>
  <button data-tab="doodads" title="Doodad palette (D)"><b>D</b> Doodads</button>
  <button data-tab="units" title="Units: camps, wells, ward spots, the base (U)"><b>U</b> Units</button>
  <button data-tab="lanes" title="Lane palette (L)"><b>L</b> Lanes</button>
  <span class="sep"></span>
  <span class="seg" id="viewSeg"></span>
  <span class="sep"></span>
  <button id="btnTest" class="test" disabled><i class="ic">&#x25B6;</i>Test Map</button>
  <button id="btnTestStop" class="hidden" title="Stop the Test: close the game">Stop</button>
  <span class="grow"></span>
  <span id="mapName" class="mapname"></span>
  <span id="readOnly" class="badge hidden">from a server: read-only</span>
  <span id="dirty" class="badge hidden">unsaved</span>
  <span id="checkState" class="badge" title="The map check (Map > Check...)">no map</span>
</header>

<aside id="left">
  <section id="minimapBox" title="The minimap: click or drag to move the view">
    <canvas id="minimap" width="250" height="250"></canvas>
  </section>
  <section id="selPreview"></section>
  <section id="selInfo"><div id="inspector"><p class="hint">Open a map.</p></div></section>
</aside>

<main id="center">
  <div id="views">
    <div class="view on" id="view2d">
      <canvas id="canvas" tabindex="0"></canvas>
    </div>
    <p class="hint" id="toolHint"></p>
  </div>
  <div id="messages" class="hidden">
    <div class="mhead">Messages <button id="btnCloseMessages" title="Close (View > Messages)">&#x2715;</button></div>
    <div id="log"></div>
  </div>
</main>

<aside id="dock">
  <nav id="dockTabs">
    <button data-tab="terrain" data-key="T">Terrain</button><button data-tab="doodads" data-key="D">Doodads</button><button data-tab="units" data-key="U" title="Units: camps, wells, ward spots, the base (U)">Units</button><button data-tab="lanes" data-key="L">Lanes</button>
  </nav>
  <div id="palette">
    <div class="ptab" id="tab_terrain"></div>
    <div class="ptab" id="tab_doodads"></div>
    <div class="ptab" id="tab_units"></div>
    <div class="ptab" id="tab_lanes"></div>
  </div>
</aside>

<footer id="status">
  <span id="st1" title="The cursor: position, height and the ground kind under it"></span>
  <span id="st2" title="The tool and its brush"></span>
  <span id="st3" title="The selection; while editing the measurements (type a number and Enter to set one)"></span>
  <span id="stSnap" title="Smart snaps: the mirror line, a lane's edge, a midpoint, the grid (click: on or off; Ctrl while dragging: off for the move)"></span>
  <span id="st4" title="The map check and Test (click: the Map Check window)"><span id="st4check"></span><span id="testState" class="badge hidden"></span><span id="st4flash"></span></span>
</footer>

<div id="windows"></div>
<div id="menuLayer"></div>

<dialog id="dlgNew">
  <form method="dialog" id="formNew">
    <h2>New map from a template</h2>
    <label>Template <select name="template" id="newTemplate"></select></label>
    <label>Name (CM_Word: the Level's and the folder's) <input name="name" required pattern="[A-Za-z0-9_]{1,80}" value="CM_"></label>
    <label>Display name (1-13 characters) <input name="display" maxlength="13"></label>
    <label>Tag (a-z, 0-9: the custom game's ~#tag) <input name="tag" pattern="[a-z0-9]+"></label>
    <label>Prefix (at most 16) <input name="prefix" maxlength="16"></label>
    <menu><button value="cancel" formnovalidate>Cancel</button> <button value="ok" id="newOk">Create</button></menu>
  </form>
</dialog>
<dialog id="dlgHelp"><div id="helpBody"></div><menu><button id="btnHelpClose">Close</button></menu></dialog>

<pre id="selftest" class="hidden"></pre>
<script src="app.js"></script>
<script src="frame.js"></script>
<script src="view3d.js"></script>
<script src="props.js"></script>
<script src="propsel.js"></script>
<script src="ground.js"></script>
<script src="void.js"></script>
<script src="overlays.js"></script>
<script src="relief.js"></script>
<script src="heights.js"></script>
<script src="feedback.js"></script>
<script src="camps.js"></script>
</body>
</html>
